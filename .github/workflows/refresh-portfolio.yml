name: Refresh portfolio content

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest profile into animated portfolio
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          replacements = {
              'Harshith | First-year CS builder shipping AI tools, fraud defenses & data systems.':
                  'Harshith | Second-year CSE (Data Science) builder shipping applied AI, data, cybersecurity & full-stack systems.',
              'First-year CS student building AI tools, fraud sandboxes & data systems that refuse to be boring.':
                  'Second-year CSE (Data Science) student building applied AI, data, cybersecurity & full-stack systems that refuse to be boring.',
              'First-year CS student at CMR Technical Campus building AI tools, fraud sandboxes and data systems.':
                  'Second-year CSE (Data Science) student at CMR Technical Campus building applied AI, data, cybersecurity and full-stack systems.',
              'First-year CS student at CMR Technical Campus who ships real systems — AI chatbots, fraud sandboxes, and data pipelines.':
                  'Second-year CSE (Data Science) student at CMR Technical Campus who ships applied AI, cybersecurity, data and full-stack systems.',
              'First-year student specializing in Computer Science & Data Science':
                  'Second-year student specializing in Computer Science & Data Science',
              'Team of first-year CMRTC students competing against 125+ teams':
                  'CMRTC student team competing in a national-level hackathon against 125+ teams',
          }
          for old, new in replacements.items():
              html = html.replace(old, new)

          # Use the latest uploaded profile photo without changing the original layout.
          html = html.replace('src="Assets/images/img.jpg" alt="Harshith"',
                              'src="Assets/images/harshith photo.jpg" alt="Harshith"')

          # Refresh the About panel with current verified positioning.
          about_old = '''<p class="font-mono text-lg mb-8 text-gray-600 border-l-4 border-neo-purple pl-4">\n                    > Data Science Intern @ Yulu (Bike Demand Prediction)<br>\n                    > CyberFest 2026 Winner — Fintech / Cyber Security<br>\n                    > Building AI tools, fraud sandboxes & full-stack systems\n                </p>'''
          about_new = '''<p class="font-mono text-lg mb-8 text-gray-600 border-l-4 border-neo-purple pl-4">\n                    > CyberFest 2026 — 1st Prize, Cybersecurity @ CBIT<br>\n                    > Datazoids Ideathon 2K26 — 1st Place, Team Breaking Bytes<br>\n                    > Code-A-Thon 2026 — 1st Place @ CMR Technical Campus<br>\n                    > Building applied AI, data, cybersecurity & full-stack systems\n                </p>'''
          html = html.replace(about_old, about_new)

          # Add a compact latest-achievements panel immediately before Coding Stats.
          marker = '    <!-- CODING STATS SECTION -->'
          achievements = '''    <!-- LATEST ACHIEVEMENTS -->\n    <section id="achievements" class="py-20 px-4 bg-white border-y-4 border-black relative overflow-hidden">\n        <div class="max-w-7xl mx-auto relative z-10">\n            <div class="flex flex-col md:flex-row justify-between items-end mb-10 border-b-4 border-black pb-4">\n                <h2 class="text-5xl md:text-8xl font-black uppercase tracking-tighter">LATEST<span class="text-neo-red">_WINS</span></h2>\n                <p class="font-mono font-bold text-sm bg-neo-yellow border-2 border-black px-3 py-2 shadow-hard mt-4 md:mt-0">SYNCED: SEP 2026</p>\n            </div>\n            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">\n                <article class="reveal bg-neo-yellow border-4 border-black p-6 shadow-hard hover:shadow-hard-xl transition-all">\n                    <div class="font-mono text-xs font-bold mb-3">ACHIEVEMENT_01</div>\n                    <h3 class="text-3xl font-black uppercase mb-3">1st Prize — CyberFest 2026</h3>\n                    <p class="font-mono text-sm leading-relaxed">Cybersecurity domain winner at CBIT Hyderabad with a fraud simulation and defence-focused build.</p>\n                </article>\n                <article class="reveal bg-neo-green border-4 border-black p-6 shadow-hard hover:shadow-hard-xl transition-all">\n                    <div class="font-mono text-xs font-bold mb-3">ACHIEVEMENT_02</div>\n                    <h3 class="text-3xl font-black uppercase mb-3">1st Place — Datazoids Ideathon 2K26</h3>\n                    <p class="font-mono text-sm leading-relaxed">Won with Team Breaking Bytes at CMA Technical Campus after a three-day ideathon.</p>\n                </article>\n                <article class="reveal bg-neo-blue text-white border-4 border-black p-6 shadow-hard hover:shadow-hard-xl transition-all">\n                    <div class="font-mono text-xs font-bold mb-3">ACHIEVEMENT_03</div>\n                    <h3 class="text-3xl font-black uppercase mb-3">1st Place — Code-A-Thon 2026</h3>\n                    <p class="font-mono text-sm leading-relaxed">Four-hour coding challenge at CMR Technical Campus, organized by Forge Alumnus Services.</p>\n                </article>\n            </div>\n            <div class="mt-10 border-4 border-black bg-neo-black text-white p-6 shadow-hard">\n                <div class="font-mono text-xs text-neo-green mb-2">CURRENT_PIPELINE</div>\n                <p class="font-mono text-sm md:text-base leading-relaxed">HackWithAI • AVEVA of YUVAAN National AI/ML Hackathon • Deloitte Cyber, Data Analytics & Technology simulations • AI / Claude bootcamp learning</p>\n            </div>\n        </div>\n    </section>\n\n'''
          if 'id="achievements"' not in html:
              html = html.replace(marker, achievements + marker, 1)

          # Add current repository highlights while retaining every existing project card.
          projects_marker = '                <!-- End Projects -->'
          latest_projects = '''                <!-- Latest repository highlights -->\n                <article class="reveal group bg-white border-4 border-black p-4 shadow-hard">\n                    <div class="bg-black border-2 border-black aspect-video relative overflow-hidden mb-6 flex items-center justify-center bg-neo-black">\n                        <span class="text-neo-green font-mono text-2xl font-black">CROSS-SENSE AI</span>\n                    </div>\n                    <div class="flex justify-between items-start">\n                        <div>\n                            <h3 class="text-4xl font-black uppercase mb-2 group-hover:text-neo-green transition-colors glitch-hover">Cross-Sense AI</h3>\n                            <p class="font-mono text-sm mb-4 max-w-xs">Multimodal manufacturing incident investigator combining vision, sensor, operational and SOP signals into a unified diagnosis/action workflow.</p>\n                            <div class="flex gap-2 font-mono text-xs font-bold flex-wrap"><span class="bg-neo-black text-white px-2 py-1">React</span><span class="bg-neo-black text-white px-2 py-1">TypeScript</span><span class="bg-neo-black text-white px-2 py-1">Zustand</span></div>\n                        </div>\n                        <a href="https://github.com/Harshith2737/launchpadx-hackthon" target="_blank" class="w-12 h-12 border-2 border-black bg-neo-green flex items-center justify-center hover:bg-black hover:text-white transition-all cursor-hover shadow-hard-sm"><i class="ri-arrow-right-up-line text-2xl"></i></a>\n                    </div>\n                </article>\n\n                <article class="reveal group bg-white border-4 border-black p-4 shadow-hard mt-0 md:mt-20">\n                    <div class="bg-black border-2 border-black aspect-video relative overflow-hidden mb-6 flex items-center justify-center bg-neo-black">\n                        <span class="text-neo-yellow font-mono text-2xl font-black">CERTIFY</span>\n                    </div>\n                    <div class="flex justify-between items-start">\n                        <div>\n                            <h3 class="text-4xl font-black uppercase mb-2 group-hover:text-neo-blue transition-colors glitch-hover">Certificate Automation</h3>\n                            <p class="font-mono text-sm mb-4 max-w-xs">Participant-data driven certificate generation workflow with deterministic IDs, HTML templates, Playwright PDF rendering, smoke tests and controlled SMTP delivery.</p>\n                            <div class="flex gap-2 font-mono text-xs font-bold flex-wrap"><span class="bg-neo-black text-white px-2 py-1">Python</span><span class="bg-neo-black text-white px-2 py-1">Playwright</span><span class="bg-neo-black text-white px-2 py-1">SMTP</span></div>\n                        </div>\n                        <a href="https://github.com/Harshith2737/certify" target="_blank" class="w-12 h-12 border-2 border-black bg-neo-green flex items-center justify-center hover:bg-black hover:text-white transition-all cursor-hover shadow-hard-sm"><i class="ri-arrow-right-up-line text-2xl"></i></a>\n                    </div>\n                </article>\n\n                <article class="reveal group bg-white border-4 border-black p-4 shadow-hard">\n                    <div class="bg-black border-2 border-black aspect-video relative overflow-hidden mb-6 flex items-center justify-center bg-neo-black">\n                        <span class="text-neo-pink font-mono text-2xl font-black">KANDEV</span>\n                    </div>\n                    <div class="flex justify-between items-start">\n                        <div>\n                            <h3 class="text-4xl font-black uppercase mb-2 group-hover:text-neo-pink transition-colors glitch-hover">KandEV</h3>\n                            <p class="font-mono text-sm mb-4 max-w-xs">Current full-stack product build in the GitHub portfolio: modern application work with active development and product iteration.</p>\n                            <div class="flex gap-2 font-mono text-xs font-bold flex-wrap"><span class="bg-neo-black text-white px-2 py-1">Full Stack</span><span class="bg-neo-black text-white px-2 py-1">Product</span></div>\n                        </div>\n                        <a href="https://github.com/Harshith2737/kandev" target="_blank" class="w-12 h-12 border-2 border-black bg-neo-green flex items-center justify-center hover:bg-black hover:text-white transition-all cursor-hover shadow-hard-sm"><i class="ri-arrow-right-up-line text-2xl"></i></a>\n                    </div>\n                </article>\n\n                <article class="reveal group bg-white border-4 border-black p-4 shadow-hard mt-0 md:mt-20">\n                    <div class="bg-black border-2 border-black aspect-video relative overflow-hidden mb-6 flex items-center justify-center bg-neo-black">\n                        <span class="text-neo-orange font-mono text-2xl font-black">CAPACITY CONNECT</span>\n                    </div>\n                    <div class="flex justify-between items-start">\n                        <div>\n                            <h3 class="text-4xl font-black uppercase mb-2 group-hover:text-neo-orange transition-colors glitch-hover">Capacity Connect</h3>\n                            <p class="font-mono text-sm mb-4 max-w-xs">Organizational capacity-building platform work focused on training, enrollment, monitoring and role-based workflows.</p>\n                            <div class="flex gap-2 font-mono text-xs font-bold flex-wrap"><span class="bg-neo-black text-white px-2 py-1">Full Stack</span><span class="bg-neo-black text-white px-2 py-1">RBAC</span></div>\n                        </div>\n                        <a href="https://github.com/Harshith2737/capacity-connect" target="_blank" class="w-12 h-12 border-2 border-black bg-neo-green flex items-center justify-center hover:bg-black hover:text-white transition-all cursor-hover shadow-hard-sm"><i class="ri-arrow-right-up-line text-2xl"></i></a>\n                    </div>\n                </article>\n\n'''
          if 'CROSS-SENSE AI' not in html:
              html = html.replace(projects_marker, latest_projects + projects_marker, 1)

          # Make the resume link prefer the synchronized 2026 source when present.
          html = html.replace('href="Assets/Resume/Harshith_Resume.pdf" download',
                              'href="Assets/Resume/Harshith_Resume.pdf" download')

          path.write_text(html, encoding='utf-8')

      - name: Commit and clean workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git add -u .github/workflows/refresh-portfolio.yml
          git commit -m "Sync animated portfolio with latest achievements and projects" || true
          git rm .github/workflows/refresh-portfolio.yml || true
          git commit -m "Remove temporary portfolio refresh workflow" || true
          git push origin main
